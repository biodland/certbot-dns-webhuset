[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "certbot-dns-webhuset"
version = "0.1.0a1"
description = "Certbot DNS-01 authenticator for Webhuset's MCP API"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["certbot>=4,<6", "dnspython>=2.6,<3", "requests>=2.31,<3"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Plugins",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Internet :: WWW/HTTP",
]

[project.entry-points."certbot.plugins"]
dns-webhuset = "certbot_dns_webhuset.dns_webhuset:Authenticator"

[project.scripts]
certbot-dns-webhuset-check = "certbot_dns_webhuset.check:main"

[project.optional-dependencies]
test = ["pytest>=8,<9", "pytest-cov>=5,<7", "ruff>=0.9,<1", "build>=1.2,<2", "twine>=6,<7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

