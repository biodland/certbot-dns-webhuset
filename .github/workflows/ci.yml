name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.10'
            certbot: 'certbot==4.0.0'
            acme: 'acme==4.0.0'
          - python: '3.12'
            certbot: 'certbot>=5,<6'
            acme: 'acme>=5,<6'
          - python: '3.14'
            certbot: 'certbot>=5,<6'
            acme: 'acme>=5,<6'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[test]' '${{ matrix.certbot }}' '${{ matrix.acme }}'
      - run: ruff check .
      - run: pytest --cov=certbot_dns_webhuset
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: Verify installed wheel outside the source tree
        shell: bash
        run: |
          python -m venv /tmp/wheel-check
          /tmp/wheel-check/bin/pip install dist/*.whl
          cd /tmp
          /tmp/wheel-check/bin/certbot plugins | tee plugins.txt
          grep -q 'dns-webhuset' plugins.txt
